<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings - SpaceVoyager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "space-dark": "#0a0a18",
              "space-blue": "#1a1a2e",
              "space-purple": "#16213e",
              "neon-blue": "#0ea5e9",
              "neon-purple": "#8b5cf6",
              "neon-cyan": "#06b6d4",
            },
            fontFamily: {
              orbitron: ["Orbitron", "sans-serif"],
              exo: ["Exo 2", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background: linear-gradient(to bottom, #0a0a18, #1a1a2e, #16213e);
        background-attachment: fixed;
      }
      .star {
        position: absolute;
        background-color: white;
        border-radius: 50%;
        animation: twinkle 5s infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }
      .nav-link {
        position: relative;
      }
      .nav-link::after {
        content: "";
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(to right, #0ea5e9, #8b5cf6);
        transition: width 0.3s ease;
      }
      .nav-link:hover::after {
        width: 100%;
      }
      .mobile-menu {
        transition: all 0.3s ease;
        max-height: 0;
        overflow: hidden;
      }
      .mobile-menu.open {
        max-height: 300px;
      }
    </style>
  </head>
  <body class="text-white font-exo min-h-screen">
    <!-- Stars Background -->
    <div id="stars-container"></div>

    <!-- Navigation -->
    <nav
      class="bg-space-dark/80 backdrop-blur-md border-b border-neon-blue/20 sticky top-0 z-50"
    >
      <div
        class="container mx-auto px-4 py-3 flex justify-between items-center"
      >
        <div class="flex items-center space-x-3">
          <div
            class="w-10 h-10 rounded-full bg-gradient-to-r from-neon-blue to-neon-purple flex items-center justify-center"
          >
            <i class="fas fa-rocket text-white"></i>
          </div>
          <a href="index.html" class="font-orbitron text-xl font-bold"
            >SpaceVoyager</a
          >
        </div>

        <div class="hidden md:flex space-x-8">
          <a
            href="index.html"
            class="nav-link hover:text-neon-blue transition-colors"
            >Home</a
          >
          <a
            href="destinations.html"
            class="nav-link hover:text-neon-blue transition-colors"
            >Destinations</a
          >
          <a
            href="booking.html"
            class="nav-link hover:text-neon-blue transition-colors"
            >Booking</a
          >
          <a
            href="my-bookings.html"
            class="nav-link hover:text-neon-blue transition-colors"
            >My Bookings</a
          >
          <a
            href="about.html"
            class="nav-link hover:text-neon-blue transition-colors"
            >About</a
          >
          <a
            href="my-bookings.html"
            class="nav-link hover:text-neon-blue transition-colors"
            >My Bookings</a
          >
          <a
            href="login.html"
            class="nav-link hover:text-neon-blue transition-colors"
            id="LoginID"
            >Login</a
          >
        </div>

        <!-- Mobile menu button -->
        <div class="md:hidden">
          <button id="mobile-menu-button" class="text-white focus:outline-none">
            <i class="fas fa-bars text-xl"></i>
          </button>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div
        id="mobile-menu"
        class="mobile-menu md:hidden bg-space-dark/90 backdrop-blur-md"
      >
        <div class="container mx-auto px-4 py-3 flex flex-col space-y-4">
          <a
            href="index.html"
            class="hover:text-neon-blue transition-colors py-2 border-b border-neon-blue/20"
            >Home</a
          >
          <a
            href="destinations.html"
            class="hover:text-neon-blue transition-colors py-2 border-b border-neon-blue/20"
            >Destinations</a
          >
          <a
            href="booking.html"
            class="hover:text-neon-blue transition-colors py-2 border-b border-neon-blue/20"
            >Booking</a
          >
          <a
            href="my-bookings.html"
            class="hover:text-neon-blue transition-colors py-2 border-b border-neon-blue/20"
            >My Bookings</a
          >
          <a
            href="about.html"
            class="hover:text-neon-blue transition-colors py-2 border-b border-neon-blue/20"
            >About</a
          >
          <a
            href="my-bookings.html"
            class="hover:text-neon-blue transition-colors py-2 border-b border-neon-blue/20"
            >My Bookings</a
          >
          <a
            href="login.html"
            class="hover:text-neon-blue transition-colors py-2"
            id="LoginID"
            >Login</a
          >
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-12 relative z-10">
      <div class="max-w-4xl mx-auto text-center mb-10">
        <h1 class="font-orbitron text-4xl md:text-5xl font-bold mb-4">
          My Bookings
        </h1>
        <p class="text-lg text-gray-300">View your upcoming space journeys</p>
      </div>

      <div id="bookings-list" class="max-w-2xl mx-auto">
        <div class="text-center py-8">
          <i class="fas fa-rocket text-4xl text-gray-500 mb-4"></i>
          <p class="text-gray-400">Loading your bookings...</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-space-dark border-t border-neon-blue/20 py-8 mt-12">
      <div class="container mx-auto px-4">
        <div class="flex flex-col md:flex-row justify-between items-center">
          <div class="mb-4 md:mb-0">
            <div class="flex items-center space-x-2 mb-2">
              <div
                class="w-8 h-8 rounded-full bg-gradient-to-r from-neon-blue to-neon-purple flex items-center justify-center"
              >
                <i class="fas fa-rocket text-white text-sm"></i>
              </div>
              <span class="font-orbitron text-lg">SpaceVoyager</span>
            </div>
            <p class="text-gray-400 text-sm">
              © 2023 SpaceVoyager. All rights reserved.
            </p>
          </div>
        </div>
      </div>
    </footer>

    <script>
      // Create stars background
      function createStars() {
        const container = document.getElementById("stars-container");
        const starCount = 100;
        for (let i = 0; i < starCount; i++) {
          const star = document.createElement("div");
          star.classList.add("star");
          const size = Math.random() * 2 + 1;
          star.style.width = `${size}px`;
          star.style.height = `${size}px`;
          star.style.left = `${Math.random() * 100}%`;
          star.style.top = `${Math.random() * 100}%`;
          star.style.animationDelay = `${Math.random() * 5}s`;
          container.appendChild(star);
        }
      }

      // Mobile menu toggle
      document
        .getElementById("mobile-menu-button")
        .addEventListener("click", function () {
          const menu = document.getElementById("mobile-menu");
          menu.classList.toggle("open");
        });

      document.addEventListener("DOMContentLoaded", function () {
        createStars();
      });
    </script>
    <script src="session.js"></script>
    <script src="my-bookings.js"></script>
  </body>
</html>
